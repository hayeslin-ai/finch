# Spec 4.1.2：手动 tag 触发的发布流程。
#
# 人工推送 v<version> tag 后，本工作流校验 tag 与版本、构建 tarball、
# 隔离安装冒烟、以 draft 方式发布并校验资产，最后快进 master 并在
# Ubuntu/macOS 上从公开链接重新安装验证。
# workflow_dispatch 用于补发与修复：Release 已完整时只做校验，
# 缺资产时从 tag 重建补齐；已推送的 tag 永不移动或删除。
#
# 自检与回写仍由 scripts/release/ 提供，但 CI 不再调用其中的 plan：
# 版本号在打 tag 前已由发布者写入仓库。
# action 固定到 commit SHA，不用浮动 tag；SHA 经 `git ls-remote` 核实：
#   actions/checkout   v6.1.0
#   actions/setup-node v6.5.0
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布或修复的 tag（形如 v0.1.1，必须已存在于远端）'
        required: true
        type: string

permissions:
  contents: write

# 同一 tag 串行；不同 tag 可并行，Latest 由发布后的复核纠正。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REF: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_ok: ${{ steps.publish.outputs.release_ok }}
    steps:
      - name: 校验 tag 形态
        id: version
        run: |
          set -euo pipefail
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.2.3：$REF"
            exit 1
          fi
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      # 保留 checkout 的凭证持久化：快进 master 要用它推送。
      # 本流程不上传任何 artifact，凭证没有经 artifact 外泄的路径（zizmor
      # artipacked 的适用前提不成立）。
      - name: 检出 tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        # 上行是 v6.1.0 的 commit SHA。
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        # 上行是 v6.5.0 的 commit SHA。
        with:
          node-version: '22.19.0'

      # 发布必须来自集成分支：在任意提交上打 tag 会产生无法追溯的发布。
      - name: 校验 tag 在 develop 上
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          if ! git merge-base --is-ancestor HEAD origin/develop; then
            echo "::error::$REF 的提交不在 origin/develop 上；发布必须来自集成分支"
            exit 1
          fi

      # 版本三处必须与 tag 一致；CI 只校验不写入，避免发布时改动仓库。
      - name: 校验 tag 与仓库版本一致
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const source = fs.readFileSync("src/version.ts", "utf8");
          const matched = /export const VERSION = \x27([^\x27]+)\x27;/.exec(source);
          if (pkg.version !== version) {
            console.error("package.json 的 version 是 " + pkg.version + "，tag 是 " + version + "：先回写版本再打 tag");
            process.exit(1);
          }
          if (matched === null || matched[1] !== version) {
            console.error("src/version.ts 的 VERSION 与 " + version + " 不一致");
            process.exit(1);
          }
          '

      - name: 安装锁定依赖
        run: npm ci

      - name: 编译
        run: npm run build

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      # 幂等入口：已完整的 Release 直接跳过构建与上传，但仍走镜像与复核。
      - name: 检查 Release 现状
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if ! gh release view "$REF" >/dev/null 2>&1; then
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$REF" --json isDraft -q .isDraft)" = "true" ]; then
            echo "draft 已存在：重建产物后补齐"
            exit 0
          fi
          mkdir -p existing
          if ! gh release download "$REF" \
            -p "finch-$VERSION.tgz" -p SHA256SUMS -D existing; then
            echo "已发布 Release 缺资产：重建补齐"
            exit 0
          fi
          if (cd existing && sha256sum -c SHA256SUMS); then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # 发布前校验 master 可快进：不可快进时先失败，避免「Release 已发布、
      # 镜像却没前移」的假成功。补发路径（Release 已完整）不受此限制，
      # 否则 master 一旦分叉就再也无法用它来修。
      - name: 校验 master 可快进（发布前）
        if: steps.state.outputs.complete != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::master 有未进入 develop 的提交（$(git rev-parse --short origin/master)），无法快进。"
            echo "::error::master 只允许快进：先人工把 master 重置到已发布的 tag 提交，再重新触发发布。"
            exit 1
          fi

      # src/version.ts 在运行时读取 process.env.BUILD_COMMIT，tsc 不会内联
      # 环境变量；必须在编译后把常量写进产物，否则 --version 永远报
      # commit unknown，排障时无法区分「同版本不同代码」。
      - name: 构建发布产物
        id: pack
        if: steps.state.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse --short HEAD)"
          export BUILD_COMMIT
          npm run build
          node -e '
          const fs = require("node:fs");
          const path = "dist/src/version.js";
          const source = fs.readFileSync(path, "utf8");
          const needle = "process.env[\x27BUILD_COMMIT\x27] ?? \x27unknown\x27";
          if (!process.env.BUILD_COMMIT) {
            console.error("BUILD_COMMIT 为空，拒绝产出无法追溯的包");
            process.exit(1);
          }
          if (!source.includes(needle)) {
            console.error("BUILD_COMMIT 注入失败：dist/src/version.js 中找不到读取行");
            process.exit(1);
          }
          const replacement = JSON.stringify(process.env.BUILD_COMMIT);
          const output = source.replace(needle, replacement);
          if (!output.includes("export const BUILD_COMMIT = " + replacement)) {
            console.error("BUILD_COMMIT 注入失败：替换结果未包含提交号");
            process.exit(1);
          }
          fs.writeFileSync(path, output);
          '
          TARBALL="finch-$VERSION.tgz"
          npm pack --pack-destination . >/dev/null
          test -f "$TARBALL"
          # WHY 单独目录：dist/ 下还有编译出的 src/、scripts/、tests/ 三个目录，
          # `gh release upload dist/*` 会把目录也传上去并以 "is a directory" 失败。
          mkdir -p release-assets
          mv "$TARBALL" release-assets/
          (cd release-assets && sha256sum "$TARBALL" > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # 用真实安装路径执行，堵住「打包后入口不可用」这类只在安装端暴露的问题。
      - name: 隔离安装冒烟
        if: steps.state.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/finch-prefix"
          # WHY 用绝对路径：npm 会把含斜杠的相对路径（assets/foo.tgz）当成
          # GitHub 简写 user/repo，转而执行 git ls-remote 并以 128 失败。
          npm install --global --ignore-scripts --prefix "$PREFIX" \
            "$GITHUB_WORKSPACE/release-assets/$TARBALL"
          COMMIT="$(git rev-parse --short HEAD)"
          EXPECTED="finch $VERSION (node $(node --version), commit $COMMIT)"
          ACTUAL="$("$PREFIX/bin/finch" --version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::--version 输出与 tag 不一致"
            echo "expected: $EXPECTED"
            echo "actual:   $ACTUAL"
            exit 1
          fi
          "$PREFIX/bin/finch" --help >/dev/null
          echo "安装冒烟通过：$ACTUAL"

      # 先以 draft 发布并校验资产；删除 draft 或改写已发布资产都不在补发路径内。
      - name: 创建或补齐 draft Release
        if: steps.state.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          EXISTS: ${{ steps.state.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$EXISTS" = "true" ]; then
            gh release upload "$REF" release-assets/* --clobber
          else
            gh release create "$REF" release-assets/* \
              --draft --verify-tag \
              --title "finch $REF" \
              --generate-notes
          fi
          names=$(gh release view "$REF" --json assets -q '.assets[].name')
          printf '%s\n' "$names" | grep -qx "finch-$VERSION.tgz"
          printf '%s\n' "$names" | grep -qx SHA256SUMS
          echo "$REF 已包含全部资产"

      # Latest 只给最高版本：并发发布或补发都不能把它抢走。
      - name: 判定 Latest 并发布
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newest() {
            gh release list -L 100 --exclude-drafts --exclude-pre-releases \
              --json tagName -q '.[].tagName' |
              { grep -E '^v[0-9]+(\.[0-9]+)*$' || true; } | sort -V | tail -1
          }
          top=$(newest)
          if [ -z "$top" ] || \
            [ "$(printf '%s\n%s\n' "$top" "$REF" | sort -V | tail -1)" = "$REF" ]; then
            latest=true
          else
            latest=false
            echo "$top 比 $REF 新：$REF 不以 Latest 发布"
          fi
          gh release edit "$REF" --draft=false --latest="$latest"
          # 两个发布同时进行时可能各自判定成功；发布后把标记纠正到最高版本。
          top=$(newest)
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -n "$top" ] && [ "$now" != "$top" ]; then
            echo "Latest 指向 ${now:-none}，纠正为 $top"
            gh release edit "$top" --latest
          fi
          echo "release_ok=true" >> "$GITHUB_OUTPUT"

      # master 只做发布镜像：已包含则跳过，可快进才推送。
      - name: 快进 master
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if git merge-base --is-ancestor HEAD origin/master; then
            echo "master 已包含 $REF 的提交"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::master 有未进入 develop 的提交，无法快进；tag 与 Release 保留待人工处理"
            exit 1
          fi
          git push origin "HEAD:refs/heads/master"

      - name: 写入步骤摘要
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPLETE: ${{ steps.state.outputs.complete }}
        run: |
          {
            echo "### 发布 $REF"
            echo ""
            echo "- 版本：$VERSION"
            echo "- Release：${{ github.server_url }}/${{ github.repository }}/releases/tag/$REF"
            if [ "$COMPLETE" = "true" ]; then
              echo "- 结果：Release 已完整，本次仅校验并补齐 master"
            else
              echo "- 结果：已构建、冒烟并发布"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 从公开链接重新下载安装：验证 Release 资产本身可用，而不只是本地打包可用。
  verify:
    needs: release
    if: needs.release.outputs.release_ok == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: 安装 Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        # 上行是 v6.5.0 的 commit SHA。
        with:
          node-version: '22.19.0'

      - name: 从 Release 下载安装并运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" \
            -p "finch-$VERSION.tgz" -D "$RUNNER_TEMP/dl"
          PREFIX="$RUNNER_TEMP/finch-prefix"
          npm install --global --ignore-scripts --prefix "$PREFIX" \
            "$RUNNER_TEMP/dl/finch-$VERSION.tgz"
          ACTUAL="$("$PREFIX/bin/finch" --version)"
          echo "$ACTUAL"
          case "$ACTUAL" in
            "finch $VERSION (node "*) ;;
            *)
              echo "::error::安装后的版本与 tag 不一致"
              exit 1
              ;;
          esac
          "$PREFIX/bin/finch" --help >/dev/null
